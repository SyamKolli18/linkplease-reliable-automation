version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: linkplease_db
    restart: always
    environment:
      POSTGRES_DB: linkplease
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d linkplease"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: linkplease_web
    restart: always
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/linkplease
      PSEUDOGRAM_BASE_URL: https://pseudogram-api.onrender.com
      PSEUDOGRAM_API_KEY: ${PSEUDOGRAM_API_KEY}
      WORKER_POLL_INTERVAL: 1.0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    container_name: linkplease_worker
    restart: always
    command: python -m app.workers.dm_worker
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/linkplease
      PSEUDOGRAM_BASE_URL: https://pseudogram-api.onrender.com
      PSEUDOGRAM_API_KEY: ${PSEUDOGRAM_API_KEY}
      WORKER_POLL_INTERVAL: 1.0
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
